[project]
name = "agenzo-a2a-for-agent-toolkit"
version = "0.1.0"
description = "MCP server that lets AI agents drive the Agenzo A2A orchestrator to book hotels/flights end-to-end."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Pin to the stable 1.x line: v2 (mcp>=2) is a breaking release that speaks the
    # 2026-07-28 protocol revision and restructures FastMCP. The official docs recommend
    # keeping a <2 upper bound until migrating. 1.x provides `mcp.server.fastmcp.FastMCP`.
    "mcp>=1.28,<2",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "uvicorn>=0.30",
]

[project.scripts]
agenzo-a2a-for-agent-toolkit = "agenzo_a2a_for_agent_toolkit.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true
